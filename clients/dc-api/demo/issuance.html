<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS-07 DC API issuance</title>
<h1>Add a credential</h1>
<p>This test page sends an OID4VCI offer through the browser Digital Credentials API.</p>
<label>Scenario
  <select id="scenario">
    <option value="pid-pre-authorized">PID, pre-authorized</option>
    <option value="pid-pre-authorized-tx-code">PID, pre-authorized with PIN</option>
    <option value="pid-authorization-code">PID, authorization code</option>
  </select>
</label>
<label>Issuer URL <input id="issuer" size="38"></label>
<label>Credential configuration IDs (comma separated)
  <input id="configurations" size="50" value="VerifiablePortableDocumentA2SDJWT,VerifiableStudentIDSDJWT">
</label>
<label>Claims JSON by configuration ID
  <textarea id="claims" rows="6" cols="70" placeholder='{"VerifiablePortableDocumentA2SDJWT":{"booking_reference":"REF-123"}}'></textarea>
</label>
<button id="prepare">Prepare offer</button>
<button id="create" disabled>Add to wallet</button>
<button id="cancel" disabled>Cancel</button>
<pre id="status">Choose a scenario and prepare an offer.</pre>
<p id="fallback" hidden>Fallback: <a id="deepLink"></a> <img id="qr" alt="Credential offer QR code" width="220"></p>
<script type="module">
  import { createDcApiIssuerClient } from "../issuer-client.js";
  let client;
  let descriptor; let controller; let prepareController; let polling = false;
  const $ = id => document.getElementById(id);
  const say = value => $("status").textContent = value;
  $("prepare").onclick = async () => {
    prepareController?.abort();
    prepareController = new AbortController();
    const activePreparation = prepareController;
    descriptor = null; $("create").disabled = true;
    try {
      client = createDcApiIssuerClient({ issuerBaseUrl: $("issuer").value || location.origin });
      const request = { scenario: $("scenario").value };
      if ($("claims").value.trim()) {
        const claims = JSON.parse($("claims").value);
        request.credentials = $("configurations").value.split(",").map(value => value.trim()).filter(Boolean).map(credential_configuration_id => ({ credential_configuration_id, payload: claims[credential_configuration_id] }));
      }
      descriptor = await client.prepare({ ...request, signal: activePreparation.signal });
      const support = client.getSupport();
      $("create").disabled = support.state === "unsupported"; $("cancel").disabled = false;
      const link = descriptor.fallback?.deepLink; $("fallback").hidden = !link;
      if (link) { $("deepLink").href = link; $("deepLink").target = "_blank"; $("deepLink").rel = "noopener"; $("deepLink").textContent = "Open wallet link"; $("deepLink").onclick = () => { void pollStatus(); }; $("qr").src = descriptor.fallback.qr; }
      say(`${support.state === "supported" ? "Ready. Click Add to wallet." : support.state === "unknown" ? "Browser support is unknown. You can try Add to wallet or use the fallback." : "DC API unavailable; use the fallback link."}${descriptor.transactionCode ? ` Synthetic transaction code: ${descriptor.transactionCode}` : ""}`);
    } catch (error) { if (activePreparation === prepareController && !activePreparation.signal.aborted) say(`${error.code || "error"}: ${error.message}`); }
  };
  $("create").onclick = async () => {
    controller = new AbortController(); $("create").disabled = true;
    try { await client.create(descriptor, { signal: controller.signal }); say("Browser handoff completed; checking issuer progress."); await pollStatus(); }
    catch (error) { say(`${error.code || "error"}: ${error.message}`); $("create").disabled = false; }
  };
  async function pollStatus() {
    if (polling) return;
    polling = true;
    const activeDescriptor = descriptor;
    const activeClient = client;
    const deadline = Date.now() + 5 * 60_000;
    let finished = false;
    while (activeDescriptor && descriptor === activeDescriptor && Date.now() < deadline && !controller?.signal.aborted) {
      try {
        const status = await activeClient.getStatus(activeDescriptor);
        say(`Issuer status: ${status.status}${status.issuedCredentialConfigurationIds?.length ? ` (${status.issuedCredentialConfigurationIds.join(", ")})` : ""}`);
        if (["issued", "failed"].includes(status.status)) { finished = true; break; }
      } catch (error) { say(`Issuer status unavailable: ${error.message}`); finished = true; break; }
      await new Promise(resolve => setTimeout(resolve, 2000));
    }
    if (!finished && descriptor === activeDescriptor && Date.now() >= deadline) say("Status polling stopped after five minutes. You can prepare a new offer or check again later.");
    polling = false;
  }
  $("cancel").onclick = () => { controller?.abort(); say("Browser request cancelled. An issuer exchange already in progress may continue."); };
  addEventListener("pagehide", () => { prepareController?.abort(); controller?.abort(); });
  $("issuer").value = new URLSearchParams(location.search).get("issuer") || location.origin;
</script>
