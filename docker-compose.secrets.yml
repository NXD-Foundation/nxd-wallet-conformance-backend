# Apply on the deployment host after copying the key there outside the checkout:
# docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
services:
  rfc-issuer:
    environment:
      TRUST_WRPAC_KEY_PATH: /run/secrets/wrpac.key
    volumes:
      - type: bind
        source: ${RFC_ISSUER_SECRETS_DIR:-/home/ni/.local/share/rfc-issuer-secrets}/wrpac.key
        target: /run/secrets/wrpac.key
        read_only: true
        bind:
          create_host_path: false
