version: '3.8'

services:
  wallet-client:
    build:
      # Monorepo root — Dockerfile needs shared utils/ and trust/
      context: ..
      dockerfile: wallet-client/Dockerfile
    container_name: wallet-client
    ports:
      - "4000:4000"
    environment:
      # Server configuration
      - PORT=4000
      - NODE_ENV=production
      
      # Redis configuration
      - WALLET_REDIS=redis:6379
      - WALLET_CREDENTIAL_TTL=86400
      - WALLET_TEST_SESSION_TTL=86400
      
      # Wallet issuance profile:
      #   compatibility (default) — permissive VCI interop; bearer fallback allowed
      #   webuild-cs01        — WE BUILD CS-01: supports authorization_code AND
      #                         pre-authorized_code by default (PAR/WUA/DPoP on auth-code;
      #                         WUA/DPoP on pre-auth; no body client_assertion)
      - WALLET_PROFILE=compatibility
      #
      # CS-01 only — optional opt-out for legacy strict testers:
      #   CS01_DISABLE_PRE_AUTHORIZED=true blocks pre-authorized_code only;
      #   authorization_code issuance remains available.
      # - CS01_DISABLE_PRE_AUTHORIZED=true
      # OAuth client_id; must match Wallet Unit Attestation sub in outbound requests
      - WALLET_CLIENT_ID=wallet-client
      # Attestation source: local-key only (trust-framework not yet implemented)
      - WALLET_ATTESTATION_SOURCE=local-key
      - WALLET_DEBUG_CREDENTIAL=false
      - WALLET_MDL_STRICT=false
      
      # Timeout configurations
      - WALLET_POLL_TIMEOUT_MS=30000
      - WALLET_POLL_INTERVAL_MS=2000
      - TRUST_PROFILE_PATH=/workspace/data/trust/webuild-wp4-pilot.json

    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wallet-network
    volumes:
      # Optional: Mount for persistent key storage
      - ./keys:/workspace/wallet-client/keys:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: wallet-redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=wallet_redis_password
    command: redis-server --requirepass wallet_redis_password
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - wallet-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  redis-data:
    driver: local

networks:
  wallet-network:
    driver: bridge
